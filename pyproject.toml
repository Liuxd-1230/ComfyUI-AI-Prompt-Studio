[project]
name = "comfyui-ai-prompt-studio"
version = "0.1.0"
description = "AI Prompt Studio — LLM-powered prompt generation, character bible, storyboard, ANIMA and MiniMax H3 prompt director for ComfyUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
